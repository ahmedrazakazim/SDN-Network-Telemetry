# SDN Network Telemetry & Traffic Anomaly Detection Configuration
# Central configuration for Topology, Controller, Telemetry, Anomaly Detection, and Mitigation

controller:
  ip: "127.0.0.1"
  of_port: 6653
  app: "controller.sdn_controller"
  openflow_version: "OpenFlow13"

telemetry:
  exporter_port: 8000
  default_poll_interval: 1
  supported_intervals:
    - 1
    - 2
    - 5

network:
  subnet: "10.0.0.0/24"
  tree_depth: 2
  tree_fanout: 2
  switches:
    s1:
      dpid: 1
      protocols:
        - "OpenFlow13"
      role: "root"
    s2:
      dpid: 2
      protocols:
        - "OpenFlow13"
      role: "pod"
    s3:
      dpid: 3
      protocols:
        - "OpenFlow13"
      role: "pod"
  hosts:
    h1:
      ip: "10.0.0.1/24"
      mac: "00:00:00:00:00:01"
      role: "attacker"
    h2:
      ip: "10.0.0.2/24"
      mac: "00:00:00:00:00:02"
      role: "victim"
    h3:
      ip: "10.0.0.3/24"
      mac: "00:00:00:00:00:03"
      role: "benign"
    h4:
      ip: "10.0.0.4/24"
      mac: "00:00:00:00:00:04"
      role: "benign"
  links:
    - ["s1", "s2"]
    - ["s1", "s3"]
    - ["s2", "h1"]
    - ["s2", "h2"]
    - ["s3", "h3"]
    - ["s3", "h4"]

monitoring:
  prometheus_port: 9090
  grafana_port: 3000
  scrape_interval: "1s"

detection:
  baseline:
    alpha: 0.2
    z_threshold: 3.0
    entropy_threshold: 3.0
    warmup_ticks: 10
  ml:
    model_type: "IsolationForest"
    contamination: 0.01
    model_path: "detection/models/isolation_forest.joblib"
    features:
      - "packet_rate"
      - "byte_rate"
      - "duration_sec"
      - "packet_count"
      - "byte_count"
      - "avg_packet_size"

mitigation:
  drop_priority: 1000
  default_timeout: 300
  forwarding_priority: 1
  table_miss_priority: 0
