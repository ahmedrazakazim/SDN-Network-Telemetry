# Grafana Datasource Provisioning
# Automatically configures Prometheus as default datasource pointing to 127.0.0.1:9090

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://127.0.0.1:9090
    isDefault: true
    version: 1
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 1s
